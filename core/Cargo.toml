[package]
name = "bookbinder-core"
version = "0.1.0"
edition = "2021"
description = "Book model, typesetting and PDF/EPUB export for Between the Lines."
license = "MIT"

[lib]
name = "bookbinder_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
miniz_oxide = "0.9.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spellbook = "0.4.2"
subsetter = { version = "0.2.6", default-features = false }
ttf-parser = "0.25.1"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
