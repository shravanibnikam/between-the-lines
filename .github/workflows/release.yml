name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    environment: release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            targets: ''
          - os: ubuntu-22.04
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci
        working-directory: studio

      # Signing is optional: each credential below is used only when its secret is set, so a
      # fork without secrets still builds (unsigned). See CONTRIBUTING.md, "Signing releases".
      - name: Use signing credentials that are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          pass() { for v in "$@"; do printf '%s<<__END__\n%s\n__END__\n' "$v" "${!v}" >> "$GITHUB_ENV"; done; }
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            pass APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            if [ -n "$APPLE_ID" ]; then
              pass APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              echo "macOS: signing with a Developer ID certificate and notarizing"
            else
              echo "macOS: signing with a Developer ID certificate (not notarized: no APPLE_ID)"
            fi
          elif [ "$RUNNER_OS" = macOS ]; then
            # ad-hoc: without any signature Apple silicon reports the download as "damaged"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "macOS: no certificate configured, the app is ad-hoc signed"
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$TRUSTED_SIGNING_ACCOUNT" ]; then
            pass AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID
            cargo install trusted-signing-cli --locked --version 0.11.0
            jq -n --arg e "$TRUSTED_SIGNING_ENDPOINT" --arg a "$TRUSTED_SIGNING_ACCOUNT" --arg c "$TRUSTED_SIGNING_PROFILE" \
              '{bundle: {windows: {signCommand: {cmd: "trusted-signing-cli", args: ["-e", $e, "-a", $a, "-c", $c, "-d", "Between the Lines", "%1"]}}}}' \
              > "$RUNNER_TEMP/sign.json"
            echo "SIGN_ARGS=--config $RUNNER_TEMP/sign.json" >> "$GITHUB_ENV"
            echo "Windows: signing with Azure Trusted Signing"
          elif [ "$RUNNER_OS" = Windows ]; then
            echo "Windows: no signing configured, SmartScreen will warn on first run"
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: studio
          tagName: ${{ github.ref_name }}
          releaseName: Between the Lines ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

      # The same Linux build as a Flatpak (studio/flatpak/build.sh), added to the draft release.
      - name: Build the Flatpak
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          sudo apt-get install -y -qq flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          name="Between.the.Lines_${VERSION}_x86_64.flatpak"
          studio/flatpak/build.sh target/release/bookbinder-studio "$PWD/$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
